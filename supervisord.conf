; Three long-running processes in one container, matching this project's
; established Dokploy hosting shape (one application = one container = one
; deploy path — see .claude-progress.md's "real-time updates" phase for why
; a second Dokploy application per process wasn't used instead).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:apache2]
command=apache2-foreground
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Replaces the old cron-driven `queue:work --stop-when-empty` (routes/console.php)
; -- that gated every queued notification (mail/FCM/broadcast) to up-to-60s
; latency, which defeated the point of the new real-time broadcast channels
; for anything still riding the queue. --tries=3 matches a reasonable retry
; count for transient failures (a slow mail host, a momentary FCM hiccup)
; without retrying forever on a genuinely broken job.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --tries=3 --sleep=1
directory=/var/www/html
autostart=true
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
