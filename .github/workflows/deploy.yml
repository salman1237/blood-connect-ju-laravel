name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Wait for CI to pass before deploying, so a broken commit never reaches production.
jobs:
  wait-for-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for tests workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: test
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  deploy:
    needs: wait-for-tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            /opt/cpanel/ea-php82/root/usr/bin/php /usr/local/bin/composer.phar install --no-dev --optimize-autoloader --no-interaction
            source ~/.nvm/nvm.sh && nvm use 22 > /dev/null
            npm ci
            npm run build
            /opt/cpanel/ea-php82/root/usr/bin/php artisan migrate --force
            /opt/cpanel/ea-php82/root/usr/bin/php artisan storage:link
            /opt/cpanel/ea-php82/root/usr/bin/php artisan config:clear
            /opt/cpanel/ea-php82/root/usr/bin/php artisan config:cache
            /opt/cpanel/ea-php82/root/usr/bin/php artisan route:cache
            /opt/cpanel/ea-php82/root/usr/bin/php artisan view:cache
            chmod -R u+rwX storage bootstrap/cache
